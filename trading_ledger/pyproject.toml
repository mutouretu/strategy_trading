[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ledger"
version = "0.1.0"
description = "Independent local trading ledger"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "requests>=2.32",
    "streamlit>=1.58",
]

[tool.setuptools.packages.find]
where = ["src"]

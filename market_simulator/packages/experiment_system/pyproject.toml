[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-system"
version = "0.1.0"
description = "Domain-neutral simulation experiment planning, execution, and storage"
requires-python = ">=3.11"
dependencies = [
    "market-protocol>=0.1,<0.2",
    "pyarrow>=14",
    "simulation-runtime>=0.1,<0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

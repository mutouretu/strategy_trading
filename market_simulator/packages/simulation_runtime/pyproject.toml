[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-runtime"
version = "0.1.0"
description = "Domain-neutral execution, ledger, and simulation runner"
requires-python = ">=3.11"
dependencies = ["market-protocol>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]

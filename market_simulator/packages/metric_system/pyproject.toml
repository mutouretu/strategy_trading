[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-system"
version = "0.1.0"
description = "Versioned evaluation metrics for simulation experiments"
requires-python = ">=3.11"
dependencies = ["experiment-system>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
